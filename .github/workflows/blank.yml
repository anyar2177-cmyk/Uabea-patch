name: Build UABEA Original - WinRT Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout UABEA original source
        uses: actions/checkout@v4
        with:
          repository: nesrak1/UABEA
          ref: master
          path: UABEA-src
          fetch-depth: 0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Patch Avalonia packages safely
        shell: pwsh
        run: |
          $versionMap = @{
            "Avalonia" = "11.3.8"
            "Avalonia.AvaloniaEdit" = "11.3.0"
            "Avalonia.Controls.DataGrid" = "11.3.8"
            "Avalonia.Desktop" = "11.3.8"
            "Avalonia.Themes.Fluent" = "11.3.8"
            "Avalonia.Themes.Simple" = "11.3.8"
            "Avalonia.Diagnostics" = "11.3.8"
            "AvaloniaEdit.TextMate" = "11.3.0"
          }

          $projects = Get-ChildItem "UABEA-src" -Filter "*.csproj" -Recurse

          $changedFiles = @()

          foreach ($project in $projects) {
            $xml = New-Object System.Xml.XmlDocument
            $xml.PreserveWhitespace = $true
            $xml.Load($project.FullName)

            $changed = $false

            $nodes = $xml.SelectNodes(
              "//*[local-name()='PackageReference']"
            )

            foreach ($node in $nodes) {
              $package = $node.GetAttribute("Include")

              if ($versionMap.ContainsKey($package)) {
                $newVersion = $versionMap[$package]
                $oldVersion = $node.GetAttribute("Version")

                if ($oldVersion -ne $newVersion) {
                  $node.SetAttribute("Version", $newVersion)
                  $changed = $true

                  Write-Host "$package : $oldVersion -> $newVersion"
                }
              }
            }

            if ($project.Name -eq "UABEAvalonia.csproj") {
              $aot = $xml.SelectSingleNode(
                "//*[local-name()='PublishAot']"
              )

              if ($aot -and $aot.InnerText -ne "false") {
                $aot.InnerText = "false"
                $changed = $true
              }
            }

            if ($changed) {
              $settings = New-Object System.Xml.XmlWriterSettings
              $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
              $settings.Indent = $false
              $settings.OmitXmlDeclaration = $true

              $writer = [System.Xml.XmlWriter]::Create(
                $project.FullName,
                $settings
              )

              try {
                $xml.Save($writer)
              }
              finally {
                $writer.Dispose()
              }

              $changedFiles += $project.FullName
            }
          }

          if ($changedFiles.Count -eq 0) {
            throw "No project files were patched."
          }

          Write-Host "Patched project files:"
          $changedFiles | ForEach-Object { Write-Host $_ }

      - name: Validate project XML
        shell: pwsh
        run: |
          $projects = Get-ChildItem "UABEA-src" -Filter "*.csproj" -Recurse

          foreach ($project in $projects) {
            $xml = New-Object System.Xml.XmlDocument
            $xml.Load($project.FullName)

            Write-Host "Valid XML: $($project.Name)"
          }

      - name: Build UABEA original
        shell: pwsh
        run: |
          msbuild UABEA-src/UABEAvalonia.sln /restore /p:Configuration=Release /p:Platform=x64

          if ($LASTEXITCODE -ne 0) {
            throw "UABEA build failed."
          }

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            "UABEA-src/UABEAvalonia/bin" `
            -Filter "UABEAvalonia.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "UABEAvalonia.exe was not generated."
          }

          Write-Host "Executable found:"
          Write-Host $exe.FullName

      - name: Upload patched UABEA artifact
        uses: actions/upload-artifact@v4
        with:
          name: uabea-original-winrt-win-x64
          path: UABEA-src/UABEAvalonia/bin/**
          if-no-files-found: error
          compression-level: 6
