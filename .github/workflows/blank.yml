name: Build UABEA Original - WinRT Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout UABEA original source
        uses: actions/checkout@v4
        with:
          repository: nesrak1/UABEA
          ref: master
          path: UABEA-src
          fetch-depth: 0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Patch all Avalonia packages
        shell: pwsh
        run: |
          $versionMap = @{
            "Avalonia" = "11.3.8"
            "Avalonia.AvaloniaEdit" = "11.3.0"
            "Avalonia.Controls.DataGrid" = "11.3.8"
            "Avalonia.Desktop" = "11.3.8"
            "Avalonia.Themes.Fluent" = "11.3.8"
            "Avalonia.Themes.Simple" = "11.3.8"
            "Avalonia.Diagnostics" = "11.3.8"
            "AvaloniaEdit.TextMate" = "11.3.0"
          }

          $projects = Get-ChildItem -Path "UABEA-src" -Filter "*.csproj" -Recurse

          if (-not $projects) {
            throw "No project files found."
          }

          $foundPackages = @{}

          foreach ($project in $projects) {
            $content = Get-Content -LiteralPath $project.FullName -Raw

            foreach ($package in $versionMap.Keys) {
              $pattern = '(<PackageReference\s+Include="' +
                [regex]::Escape($package) +
                '"\s+Version=")[^"]+(")'

              $matches = [regex]::Matches($content, $pattern)

              if ($matches.Count -gt 0) {
                $replacement = '$1' + $versionMap[$package] + '$2'

                $content = [regex]::Replace(
                  $content,
                  $pattern,
                  $replacement
                )

                $foundPackages[$package] = $true

                Write-Host "Updated $package in $($project.Name)"
              }
            }

            Set-Content -LiteralPath $project.FullName `
              -Value $content -Encoding utf8
          }

          $missing = @(
            $versionMap.Keys |
            Where-Object { -not $foundPackages.ContainsKey($_) }
          )

          if ($missing.Count -gt 0) {
            throw "Missing package references: $($missing -join ', ')"
          }

          Write-Host "All Avalonia package references updated."

      - name: Disable Native AOT
        shell: pwsh
        run: |
          $project = "UABEA-src/UABEAvalonia/UABEAvalonia.csproj"

          $content = Get-Content -LiteralPath $project -Raw

          $content = $content.Replace(
            '<PublishAot>true</PublishAot>',
            '<PublishAot>false</PublishAot>'
          )

          Set-Content -LiteralPath $project `
            -Value $content -Encoding utf8

      - name: Build UABEA original
        shell: pwsh
        run: |
          msbuild UABEA-src/UABEAvalonia.sln `
            /restore `
            /p:Configuration=Release

          if ($LASTEXITCODE -ne 0) {
            throw "UABEA build failed."
          }

      - name: Verify build output
        shell: pwsh
        run: |
          $output = "UABEA-src/UABEAvalonia/bin/Release/net8.0"

          if (-not (Test-Path "$output/UABEAvalonia.exe")) {
            throw "UABEAvalonia.exe was not generated."
          }

          Write-Host "Build output verified."
          Get-ChildItem $output

      - name: Upload patched UABEA artifact
        uses: actions/upload-artifact@v4
        with:
          name: uabea-original-winrt-win-x64
          path: UABEA-src/UABEAvalonia/bin/Release/net8.0
          if-no-files-found: error
          compression-level: 6
